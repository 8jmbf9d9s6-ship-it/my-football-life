.hit{position:absolute;border:0;background:transparent;color:transparent;z-index:5}
.hit.new{left:14%;right:14%;top:60.5%;height:6.6%}
.hit.cont{left:14%;right:14%;top:67.7%;height:6.2%}
.hit.settings{left:14%;right:14%;top:75%;height:6.2%}
.hit.topsettings{right:4%;top:2%;width:18%;height:5%}

/* CREATE: built once in HTML, no UI-background image underneath. */
#create{padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,#0d2238,#06111c 58%)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font-size:17px;font-weight:900;letter-spacing:.5px}
.gear{border:1px solid #56718c;background:#0c1928;color:#fff;padding:7px 10px;font-weight:900}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 12px}
.step{text-align:center;font-size:8.5px;color:#71879a;position:relative;padding-top:27px}
.step:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border:2px solid #415a72;border-radius:50%;display:grid;place-items:center;background:#0b1724;font-weight:900}
.step.active{color:#fff} .step.active:before{background:#1e6fd1;border-color:#7ab7f0}
.panel{border:2px solid var(--line);background:linear-gradient(#0c1928,#08131f);padding:11px;box-shadow:4px 4px 0 #010305}
.title{text-align:center;font-size:23px;font-weight:900;margin:0 0 3px}
.subtitle{text-align:center;font-size:10.5px;color:var(--muted);margin-bottom:10px}

.main{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px}.main>*{min-width:0}
.avatarCard{background:#0a1725;border:1px solid #314d67;padding:7px;align-self:start}
.avatar{width:100%;height:215px;object-fit:contain;object-position:center center;display:block;image-rendering:pixelated;border:1px solid #203b53;background:#0e1d2b}
.mini{margin-top:7px;background:#07131f;border:1px solid #29435b;padding:7px;font-size:8.8px;line-height:1.7}
.form{display:grid;gap:6px;min-width:0}
.field{display:grid;grid-template-columns:68px minmax(0,1fr);gap:6px;align-items:center;background:#0c1928;border:1px solid #223a51;padding:6px;min-width:0}.field>*{min-width:0}
.field label{font-size:10.5px;font-weight:900}
input,select{width:100%;max-width:100%;min-width:0;height:35px;background:#06111c;color:#fff;border:2px solid #2b4965;padding:0 7px;font-weight:800;font-size:11.5px;outline:none;border-radius:0}
.nameRow{display:flex;gap:5px}
.nameRow input{flex:1}
.random{width:54px;border:2px solid #527aa1;background:#17314d;color:#fff;font-weight:900;font-size:9.5px}
.footRow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.footBtn{height:35px;border:2px solid #2b4965;background:#0b1a29;color:#a9bac9;font-weight:900}
.footBtn.on{background:#1d65be;border-color:#78b4ed;color:#fff}

.rolebox{margin-top:9px;display:grid;grid-template-columns:104px 1fr;gap:9px}
.pitch{height:135px;background:
linear-gradient(90deg,transparent 49%,rgba(255,255,255,.6) 49% 51%,transparent 51%),
linear-gradient(#6fae35,#498d27);border:3px solid #b7df79;position:relative}
.pitch:before{content:"";position:absolute;left:9%;right:9%;top:7%;bottom:7%;border:2px solid rgba(255,255,255,.75)}
.pitch:after{content:"";position:absolute;width:38px;height:38px;border:2px solid rgba(255,255,255,.8);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.role{background:#07131f;border:1px solid #29435b;padding:8px;font-size:9.5px;line-height:1.4}
.role b{display:block;color:#70d250;font-size:12.5px;margin-bottom:4px}
.barline{display:flex;gap:5px;align-items:center;margin-top:4px}
.bar{height:6px;flex:1;background:#101b25}
.bar i{display:block;height:100%;background:#6cbd41}
.tip{margin-top:9px;color:#9fb0c0;font-size:9.5px}
.actions{display:grid;grid-template-columns:1fr 1.7fr;gap:10px;margin-top:11px}
.actions button{height:46px;border:2px solid #587692;background:#0c1723;color:#fff;font-weight:900;font-size:14px}
.actions .next{background:linear-gradient(#2d7ee1,#185cad);border-color:#8fc5ff}

.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.76);align-items:center;justify-content:center;padding:22px}
.modal.show{display:flex}
.box{width:min(390px,100%);background:#0a1725;border:2px solid #587692;padding:16px;color:#fff}
.box h3{margin:0 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #2e465d}
.row button,.close{background:#17283b;border:1px solid #718ba5;color:#fff;padding:8px 12px;font-weight:900}
.close{width:100%;margin-top:14px;padding:12px;background:#1f63b1}
.notice{display:none;position:fixed;left:20px;right:20px;top:50%;transform:translateY(-50%);z-index:35;background:#0a1725;border:2px solid #587692;padding:17px;text-align:center}
.notice.show{display:block}
.notice p{font-size:12px;line-height:1.5;color:#c3d0dd;white-space:pre-line}
.notice button{width:100%;padding:11px;background:#1f63b1;border:1px solid #78abe0;color:#fff;font-weight:900}

.birthRow{display:grid;grid-template-columns:1.55fr .85fr .85fr;gap:5px;min-width:0}
.birthPart{position:relative;min-width:0}
.birthPart input{padding-right:18px;text-align:center;font-size:10.5px}
.birthPart span{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;color:#9fb0c0;pointer-events:none}
.numberRow{display:grid;grid-template-columns:76px 1fr;gap:5px;min-width:0}
.numberRow input{text-align:center}
.numberHint{font-size:8.5px;color:#8fa3b6;line-height:1.35;margin-top:4px}
@media(max-width:390px){
  .main{grid-template-columns:92px minmax(0,1fr);gap:7px}
  .avatar{height:205px}
  .field{grid-template-columns:62px minmax(0,1fr);padding:5px}
  .field label{font-size:9.5px}
  input,select,.footBtn{font-size:10.5px}
  .random{width:46px;font-size:8.5px}
  .rolebox{grid-template-columns:92px minmax(0,1fr);gap:7px}
}

</style>
</head>

<div class="app">

  <button class="hit settings" aria-label="설정" onclick="openSettings()"></button>
  <button class="hit topsettings" aria-label="상단 설정" onclick="openSettings()"></button>
</section>

<section id="create" class="screen">

    <div class="brand">MY FOOTBALL LIFE</div>

  </div>

  <div class="steps">

  <div class="panel">
    <div class="title">선수 생성</div>
    <div class="subtitle">당신의 축구 인생을 시작하세요.</div>

        </div>

                <option value="prefer">희망번호 우선</option>
                <option value="coach">감독에게 맡김</option>
              </select>
            </div>
            <div class="numberHint">희망번호는 입단 후 확정됩니다. 이미 사용 중이면 기존 선수와 상의 이벤트가 발생할 수 있습니다.</div>
          </div>
        </div>

        <div class="field">
          <label>포지션</label>
          <select id="posInput" onchange="updateMini()">
            <option value="CAM">공격형 미드필더 (CAM)</option>
            <option value="ST">공격수 (ST)</option>
            <option value="LW">왼쪽 윙 (LW)</option>
            <option value="RW">오른쪽 윙 (RW)</option>
            <option value="CM">중앙 미드필더 (CM)</option>
            <option value="CDM">수비형 미드필더 (CDM)</option>
            <option value="CB">센터백 (CB)</option>
            <option value="LB">왼쪽 풀백 (LB)</option>
            <option value="RB">오른쪽 풀백 (RB)</option>
            <option value="GK">골키퍼 (GK)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="rolebox">
      <div class="pitch"></div>
      <div class="role">
        <b id="roleName">공격형 미드필더 (CAM)</b>
        <span id="roleDesc">공격과 패스를 조율하며 득점 기회를 만들어내는 포지션.</span>
        <div class="barline"><span>공격</span><div class="bar"><i id="barAttack" style="width:75%"></i></div></div>
        <div class="barline"><span>수비</span><div class="bar"><i id="barDefense" style="width:35%"></i></div></div>
        <div class="barline"><span>패스</span><div class="bar"><i id="barPass" style="width:80%"></i></div></div>
        <div class="barline"><span>스피드</span><div class="bar"><i id="barSpeed" style="width:65%"></i></div></div>
      </div>
    </div>

    <div class="tip">TIP: 이름은 직접 입력하거나 랜덤으로 만들 수 있습니다.</div>

    <div class="actions">
      <button onclick="showTitle()">뒤로</button>
      <button class="next" onclick="nextStep()">다음</button>
    </div>
  </div>
</section>

<div id="settingsModal" class="modal">
  <div class="box">
    <h3>설정</h3>
    <div class="row"><span>BGM</span><button onclick="toggle(this)">ON</button></div>
    <div class="row"><span>효과음</span><button onclick="toggle(this)">ON</button></div>
    <div class="row"><span>진동</span><button onclick="toggle(this)">ON</button></div>
    <button class="close" onclick="closeSettings()">닫기</button>
  </div>
</div>

<div id="notice" class="notice">
  <b id="noticeTitle"></b>
  <p id="noticeText"></p>
  <button onclick="closeNotice()">확인</button>
</div>

</div>

<script>
let selectedFoot='오른발';
const last=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권'];
const first=['민준','서준','도윤','예준','시우','하준','지호','준서','건우','현우','우진','지훈','재현','민재','성민','태윤','승현','재환','도현','준혁'];

function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function showCreate(){switchScreen('create')}
function showTitle(){switchScreen('title')}
function randomName(){
  nameInput.value=last[Math.floor(Math.random()*last.length)]+first[Math.floor(Math.random()*first.length)];
}
function setFoot(v){
  selectedFoot=v;
  rFoot.classList.toggle('on',v==='오른발');
  lFoot.classList.toggle('on',v==='왼발');
  updateMini();
}

const positionProfiles = {
  CAM:{name:'공격형 미드필더 (CAM)',desc:'공격과 패스를 조율하며 득점 기회를 만들어내는 포지션.',attack:75,defense:35,pass:80,speed:65},
  ST:{name:'공격수 (ST)',desc:'상대 골문을 노리며 득점에 가장 집중하는 포지션.',attack:92,defense:20,pass:58,speed:78},
  LW:{name:'왼쪽 윙 (LW)',desc:'측면에서 스피드와 드리블로 수비를 흔드는 포지션.',attack:82,defense:28,pass:67,speed:90},
  RW:{name:'오른쪽 윙 (RW)',desc:'오른쪽 측면을 공략하며 돌파와 크로스를 담당하는 포지션.',attack:82,defense:28,pass:67,speed:90},
  CM:{name:'중앙 미드필더 (CM)',desc:'공수 연결과 경기 조율을 모두 담당하는 포지션.',attack:65,defense:58,pass:84,speed:62},
  CDM:{name:'수비형 미드필더 (CDM)',desc:'수비진 앞에서 공간을 막고 공을 회수하는 포지션.',attack:42,defense:82,pass:72,speed:58},
  CB:{name:'센터백 (CB)',desc:'중앙 수비를 책임지고 상대 공격을 차단하는 포지션.',attack:30,defense:92,pass:55,speed:48},
  LB:{name:'왼쪽 풀백 (LB)',desc:'왼쪽 측면 수비와 오버래핑을 함께 수행하는 포지션.',attack:55,defense:76,pass:62,speed:78},
  RB:{name:'오른쪽 풀백 (RB)',desc:'오른쪽 측면 수비와 오버래핑을 함께 수행하는 포지션.',attack:55,defense:76,pass:62,speed:78},
  GK:{name:'골키퍼 (GK)',desc:'골문을 지키고 슈팅을 막는 마지막 수비수.',attack:15,defense:95,pass:50,speed:40}
};

function updatePositionProfile(){
  const p=positionProfiles[posInput.value]||positionProfiles.CAM;
  roleName.textContent=p.name;
  roleDesc.textContent=p.desc;
  barAttack.style.width=p.attack+'%';
  barDefense.style.width=p.defense+'%';
  barPass.style.width=p.pass+'%';
  barSpeed.style.width=p.speed+'%';
}

function updateMini(){
  miniRegion.textContent=regionInput.value;
  miniFoot.textContent=selectedFoot;
  miniPos.textContent=posInput.value;
  updatePositionProfile();
  const y=Number(birthYear.value)||2011;
  miniAge.textContent=(2026-y)+'세';
  miniNumber.textContent=desiredNumber.value||'-';
}
function nextStep(){
  const n=nameInput.value.trim();
  if(!n){showNotice('확인','이름을 입력해주세요.');return}
  const num=desiredNumber.value ? desiredNumber.value+'번' : '등번호 미정';
  const mode=numberPriority.value==='coach' ? '감독 결정' : '희망번호 우선';
  showNotice('선수 생성 완료',n+'\n'+regionInput.value+' · '+selectedFoot+' · '+posInput.value+'\n희망 등번호: '+num+' ('+mode+')\n\n입단 후 번호가 비어 있으면 배정되고, 사용 중이면 감독 결정 또는 기존 선수와 상의 이벤트로 이어집니다.');
}
function showNotice(t,x){noticeTitle.textContent=t;noticeText.textContent=x;notice.classList.add('show')}
function closeNotice(){notice.classList.remove('show')}
function openSettings(){settingsModal.classList.add('show')}
function closeSettings(){settingsModal.classList.remove('show')}
function toggle(b){b.textContent=b.textContent==='ON'?'OFF':'ON'}

function clampBirth(){
  let y=Math.max(2008,Math.min(2013,Number(birthYear.value)||2011));
  let m=Math.max(1,Math.min(12,Number(birthMonth.value)||1));
  const maxDay=new Date(y,m,0).getDate();
  let d=Math.max(1,Math.min(maxDay,Number(birthDay.value)||1));
  birthYear.value=y; birthMonth.value=m; birthDay.value=d;
  updateMini();
}
[birthYear,birthMonth,birthDay].forEach(el=>{
  el.addEventListener('change',clampBirth);
  el.addEventListener('blur',clampBirth);
});
updateMini();
updatePositionProfile();
</script>
</body>
</html>
